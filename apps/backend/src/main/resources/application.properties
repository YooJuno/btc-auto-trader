server.address=${APP_SERVER_ADDRESS:127.0.0.1}
server.port=8080
server.forward-headers-strategy=framework

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=${APP_AUTH_SESSION_CLEANUP_CRON:0 */30 * * * *}

server.servlet.session.timeout=${APP_AUTH_SESSION_TIMEOUT:14d}
server.servlet.session.cookie.max-age=${APP_AUTH_SESSION_COOKIE_MAX_AGE:14d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${APP_AUTH_SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${APP_AUTH_SESSION_COOKIE_SECURE:false}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
db.migration.oid-to-text.enabled=true
db.migration.tenant-strategy-config.enabled=true

# Spring's default scheduler pool is ONE thread, shared by the trade tick, order reconciliation,
# session cleanup and the universe refresh. On one thread a slow tick starves reconciliation, and any
# slow job delays the tick that evaluates stop-losses. Give each its own thread.
spring.task.scheduling.pool.size=4

engine.tick-ms=5000
engine.order-cooldown-seconds=30
engine.failure-backoff-base-seconds=5
engine.failure-backoff-max-seconds=300
engine.state-restore-limit=500

# LIVE  : real Upbit orders against the real account.
# PAPER : simulated fills against REAL market data, using the same fee/slippage rates the engine sizes
#         with. Only account state and order execution are simulated — signals, exits, sizing and the
#         regime gate run the identical code path, which is what makes a paper run evidence about live.
# Defaults to LIVE so deploying this build never silently stops an existing live account; safety comes
# from the mode being visible in the UI, not from flipping it underneath you.
trading.mode=LIVE
trading.paper.initial-krw=1000000

trading.markets=KRW-BTC
trading.min-krw=5000
trading.fee-rate=0.0005
trading.slippage-pct=0.001

strategy.force-profile=

# Entry model. Registry keys: trend_breakout | squeeze_breakout
#   trend_breakout   - trend gate + Donchian break (the original)
#   squeeze_breakout - trend gate + Bollinger contraction + break + volume, with NO overextension cap
signal.model=trend_breakout
# Bollinger bandwidth at or below this counts as contracted, for squeeze_breakout.
signal.squeeze.max-bandwidth-pct=2.5

signal.timeframe-unit=60
signal.use-closed-candle=true
signal.ma-short=5
signal.ma-long=55
signal.rsi-period=14
# rsi-buy-threshold and min-confirmations do NOT gate entry in any current model — they are carried in
# the decision log for auditing only. Documented here rather than left to be discovered by a user who
# tunes them and sees no change. rsi-sell-threshold IS live (momentum_reversal exit) and
# rsi-overbought IS live (squeeze_breakout).
signal.rsi-buy-threshold=53
signal.rsi-sell-threshold=47
signal.rsi-overbought=68
signal.macd-fast=12
signal.macd-slow=26
signal.macd-signal=9
signal.adx-period=14
signal.min-adx=20
signal.volume-lookback=20
signal.min-volume-ratio=1.2
# Window/stddev feed bollingerBandwidthPct, which squeeze_breakout gates on.
signal.bollinger.window=20
signal.bollinger.stddev=2.0
signal.breakout-lookback=20
signal.breakdown-lookback=10
signal.breakout-pct=0.05
signal.max-extension-pct=0
signal.ma-long-slope-lookback=5
signal.min-confirmations=2
signal.htf-confirm.enabled=true
signal.htf-confirm.unit=240
signal.htf-confirm.ma-short=20
signal.htf-confirm.ma-long=50
signal.htf-confirm.slope-lookback=3
signal.htf-confirm.min-ma-long-slope-pct=0.0
signal.htf-confirm.cache-minutes=3

# Cross-sectional momentum universe selection.
# Ranks the KRW universe by trailing return and lets the engine open NEW positions only in the leaders.
# The per-market trend/breakout logic still decides WHEN to enter. Held markets are always kept in scope
# so a name that drops out still has its stop-loss evaluated.
# MEASURED AND REJECTED. backtest_cross_sectional.py over 287 KRW markets / 663 days:
#   ROI -75.3%, CAGR -53.7%, MDD 84.2%, Sharpe -0.96, vs KRW-BTC buy&hold -12.8% (alpha -62.5%p)
# and that number is survivorship-biased UPWARD because delisted coins are absent from Upbit's list.
# Buying the top 30-day gainers in this market is buying the top of a pump. Do not enable without
# re-measuring. Kept so the result stays reproducible rather than deleted and re-invented later.
signal.universe.enabled=false
signal.universe.quote=KRW
signal.universe.min-daily-value-krw=5000000000
signal.universe.lookback-days=30
# The most recent week is excluded: short-horizon crypto returns mean-revert, so including it turns a
# momentum screen into a reversal screen.
signal.universe.skip-days=7
signal.universe.top-k=5
signal.universe.refresh-minutes=1440
# How often the refresh job wakes to check staleness. The expensive ranking still runs at most once per
# refresh-minutes window; this only controls how promptly a stale snapshot is noticed.
signal.universe.refresh-check-ms=60000
signal.universe.max-candidates=40
# Hard risk-off gate. Below this MA the universe is empty and no new entries are taken anywhere.
signal.universe.risk-off-market=KRW-BTC
signal.universe.risk-off-ma-days=100

regime.filter.enabled=true
regime.filter.timeframe-unit=240
regime.filter.ma-short=30
regime.filter.ma-long=90
regime.filter.ma-long-slope-lookback=5
regime.filter.min-ma-long-slope-pct=0.0
regime.filter.volatility-window=48
regime.filter.max-volatility-pct=2.2
regime.switch.enabled=true
regime.switch.risk-on-slope-pct=0.10
regime.switch.risk-on-max-volatility-pct=0.8
regime.switch.risk-on-size-multiplier=1.20
regime.switch.risk-on-take-profit-multiplier=1.1
regime.switch.risk-on-stop-loss-multiplier=1.05
regime.switch.risk-on-trailing-stop-multiplier=1.0
regime.switch.risk-on-rsi-buy-adjust=-1.0
regime.switch.caution-size-multiplier=0.8
regime.switch.caution-take-profit-multiplier=1.0
regime.switch.caution-stop-loss-multiplier=0.9
regime.switch.caution-trailing-stop-multiplier=1.0
regime.switch.caution-rsi-buy-adjust=1.5

risk.trailing-window=20
risk.atr-period=20
risk.atr-stop-loss-multiplier=2.6
risk.atr-trailing-stop-multiplier=3.0
risk.atr-trailing-arm-multiplier=3.5
risk.atr-risk-sizing-enabled=true
# true  : ATR x multiplier sets the stop/trailing thresholds, and the per-market 손절 %/트레일링 %
#         values act only as a fallback for when ATR is unavailable.
# false : the configured percentages are used as-is.
# Previously the ATR override was unconditional with no way off, so those settings never applied.
risk.atr-exit-thresholds-enabled=true
risk.partial-take-profit-cooldown-minutes=120
risk.stop-loss-cooldown-minutes=45
risk.reentry-cooldown-minutes=30
risk.stop-loss-guard-lookback-minutes=180
risk.stop-loss-guard-trigger-count=3
risk.stop-loss-guard-lock-minutes=240
risk.daily-loss-limit-pct=1.2
risk.volatility-window=30
risk.target-vol-pct=0.35

# Public market data is identical for every tenant, so each tenant re-fetching it multiplied the
# IP-scoped Upbit budget for no information gain. Candles are cached briefly and shared.
# Tickers are deliberately NOT cached: fetchTicker is the price the stop-loss decides on.
# 0 disables either cache.
upbit.cache.candles-ms=15000
upbit.cache.markets-ms=600000

upbit.rate-limit.enabled=true
upbit.rate-limit.min-interval-ms=120
upbit.rate-limit.max-requests-per-second=8
upbit.rate-limit.max-requests-per-minute=240

api.auth.enabled=false
api.auth.header=X-API-KEY
api.auth.key=

app.auth.success-redirect-url=${APP_AUTH_SUCCESS_REDIRECT_URL:/}
app.auth.failure-redirect-url=${APP_AUTH_FAILURE_REDIRECT_URL:/?loginError=true}
app.auth.redirect.dynamic-enabled=${APP_AUTH_DYNAMIC_REDIRECT_ENABLED:true}
app.auth.redirect.frontend-port=${APP_AUTH_FRONTEND_PORT:5173}
app.multi-tenant.owner-email=${APP_OWNER_EMAIL:juno980220@gmail.com}
app.trading.owner-only-mode=${APP_TRADING_OWNER_ONLY_MODE:true}
app.exchange-key-encryption-key=${APP_EXCHANGE_KEY_ENCRYPTION_KEY:}

feature.admin-approval.enabled=${FEATURE_ADMIN_APPROVAL_ENABLED:true}

orders.reconcile.enabled=true
orders.reconcile.delay-ms=10000
orders.reconcile.lookback-minutes=60
orders.reconcile.stale-minutes=180
orders.pending-window-minutes=30
orders.chance-cache-minutes=5
